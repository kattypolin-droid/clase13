        ul{
            list-style: none;
        }

        li{
            display: inline-block;

        }

        li a{
            display: inline-block;
            text-decoration: none;
            color: white;
            background-color: #0077cc;
            padding: 15px 25px;
            border: 3px solid #005fa3;
            border-radius: 30px;
            transition: all 0.5s ease;
        }

        li a:hover{
            background-color: #00cc66;
            color: black;
            border-radius: 5px 30px 5px 30px;
            transform: scale(1.1) rotate(-3deg);
        }
